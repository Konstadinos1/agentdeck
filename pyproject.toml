[project]
name = "agentdeck"
version = "0.1.0"
description = "Terminal control center for local AI coding agents: live processes, RAM/CPU, sessions, token usage and cost."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "psutil>=6.0",
]

[project.scripts]
agentdeck = "agentdeck.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
